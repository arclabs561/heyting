[package]
name = "heyting"
version = "0.16.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Arc <attobop@gmail.com>"]
repository = "https://github.com/arclabs561/heyting"
description = "Complex logical query answering over knowledge graph embeddings"
keywords = ["knowledge-graph", "query-answering", "fuzzy-logic", "reasoning"]
categories = ["science", "algorithms"]
readme = "README.md"
publish = true

[workspace]

[dependencies]
tnorms = "0.2.0"
# Optional: ANN-backed candidate sources.
hyperball = { version = "0.1.6", optional = true, default-features = false }
precinct = { version = "0.8.5", optional = true, default-features = false, features = ["index"] }
vicinity = { version = "0.10.5", optional = true, default-features = false, features = ["hnsw"] }
# Optional: adapt a tranz point-embedding model as an AtomicScorer.
tranz = { version = "0.8.0", optional = true }
# Optional: Query2Box-style scoring over trained box embeddings, and the
# subsume::clqa gated LCA readout for off-seam conjunctive conformal.
subsume = { version = "0.17", default-features = false, optional = true }

[features]
# Enables candidate sources backed by hyperbolic geometry.
hyperball = ["dep:hyperball"]
# Enables candidate sources backed by `precinct` region indexes.
precinct = ["dep:precinct"]
# Enables `adapters::PointModel`, wrapping a `tranz::Scorer`.
tranz = ["dep:tranz"]
# Enables `adapters::BoxModel`, Query2Box scoring via `subsume`.
subsume = ["dep:subsume"]
# Enables candidate sources backed by `vicinity` vector indexes.
vicinity = ["dep:vicinity"]

[[example]]
name = "fb15k237_clqa"
required-features = ["tranz"]

[[example]]
name = "icews14_temporal_clqa"
required-features = ["tranz"]

[[example]]
name = "betae_fb15k237"
required-features = ["tranz"]

[[example]]
name = "el_clqa_gated_conformal"
required-features = ["subsume"]

[[example]]
name = "retrieval_candidates"
required-features = ["hyperball", "precinct", "vicinity"]

[[example]]
name = "el_clqa"
required-features = ["subsume"]

[[example]]
name = "el_clqa_conformal"

[[example]]
name = "raw_calibration"

[[example]]
name = "taxonomy_query"

[[example]]
name = "temporal_query"

[dev-dependencies]
proptest = "1.5"
rand = "0.9"
serde-pickle = "1.2"

[lints.rust]
missing_docs = "warn"
